name: Build Car Racing

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get J2ME toolchain
        run: |
          git clone --depth 1 https://github.com/retro-systems-lab/j2me-devkit.git j2me-devkit

      - name: Build Car Racing
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload CarRacing.jar
        uses: actions/upload-artifact@v4
        with:
          name: Car-Racing
          path: build/CarRacing.jar
