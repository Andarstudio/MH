name: Build Car Racing

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Car Racing
        uses: actions/checkout@v4

      - name: Checkout J2ME build system
        uses: actions/checkout@v4
        with:
          repository: gtrxAC/j2me-template
          path: j2me-template

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install build dependencies
        working-directory: j2me-template
        run: npm install

      - name: Copy game source
        run: |
          rm -rf j2me-template/src
          mkdir -p j2me-template/src
          cp src/*.java j2me-template/src/

      - name: Copy manifest
        run: |
          cp manifest.mf j2me-template/manifest.mf

      - name: Build Car Racing
        working-directory: j2me-template
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Show build output
        run: |
          echo "Build files:"
          find j2me-template/bin -type f -maxdepth 2 -print

      - name: Upload Car Racing
        uses: actions/upload-artifact@v4
        with:
          name: CarRacing
          path: j2me-template/bin/
