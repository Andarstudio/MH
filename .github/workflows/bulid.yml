name: Build Car Racing

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Get J2ME template
        run: |
          git clone --depth 1 https://github.com/gtrxAC/j2me-template.git j2me

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload CarRacing.jar
        uses: actions/upload-artifact@v4
        with:
          name: Car-Racing
          path: build/CarRacing.jar
